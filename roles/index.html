<!DOCTYPE html>
<html>

<head>
    <title>Meals on Wheels</title>
    <link rel="stylesheet" href="/Meals-on-Wheels/links/main.css">
    <script src="links/main.js"></script>
    <link rel="icon" type="image/x-icon" href="/Meals-on-Wheels/images/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
    <a style="position: fixed;" class="bar-button" 
        onclick="let it = document.querySelector('.sidebar');
        it.classList.remove('hidden');
        it.classList.toggle('slide');
        it.classList.toggle('slideAway');
        it.style.webkitAnimation = 'none';
        it.offsetHeight;
        it.style.animation = null;
        main.style.filter  = 'brightness(50%)';">
        <img class="navbarstack" src="/Meals-on-Wheels/images/navbarstack.png">
    </a> <!-- main page burger button-->
    <div class="sidebar hidden slideAway">
            <a  style="padding: 0; margin:3vh 0 0 20px ;" class="bar-button" onclick="
            let it = document.querySelector('.sidebar');
            it.classList.remove('hidden');
            it.classList.toggle('slide');
            it.classList.toggle('slideAway');
            it.style.webkitAnimation = 'none';
            it.offsetHeight;
            it.style.animation = null;
            main.style.filter  = 'brightness(100%)'">
            <img class="navbarstack" src="/Meals-on-Wheels/images/navbarstack.png">
            </a>
            <a href="/Meals-on-Wheels/">Home</a>
            <a href="/Meals-on-Wheels/interactive/">Interative</a>
            <a href="/Meals-on-Wheels/roles/">Roles</a>
    </div> <!--sidebar-->
</a>
    <div id="main">
        
        
        <p class="title">Roles</p>
        
        <div class="centered-box"> 
        
            <div class="role-button">
                <p>Whaling Team</p>
                <a target="_self"
                    href="/Meals-on-Wheels/roles/whaling-team/">
                    <img style="margin-top: 20%;" src="/Meals-on-Wheels/images/whaling team icon.png">
                </a>
            </div>
            <div class="role-button">
                <p>Sailing Team</p>
                <a target="_self"
                    href="/Meals-on-Wheels/roles/sailing-team/">
                    <img src="/Meals-on-Wheels/images/sailng team icon.png">
                </a>
            </div>
         
        </div>

        
        
        <p class="text" style="margin-bottom:0;">Thanks for your interest in our strategy, have fun!</p>
        
    </div>

</body>

</html>
